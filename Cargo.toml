[package]
name = "rust-diablo"
version = "0.1.0"
edition = "2021"

[features]
default = []

[dependencies]
sdl2 = { version = "0.37", features = ["image"] }
anyhow = "1.0"
# Step 5.1: 压缩支持
flate2 = "1.0"      # Zlib 解压缩
once_cell = "1.19"
implode = "0.1.1"   # PKWare 解压缩

# 使用 mpq-rust-patched 提取文件
mpq = { path = "../mpq-rust-patched" }

# Step 6.1: Tiles系统依赖
bitflags = "2.4"    # Tile属性标志位
image = "0.24"      # PNG图像加载

# Step 6.3: 地牢生成
rand = "0.8"        # 随机数生成

[build-dependencies]
cc = "1.0"

[profile.release]
opt-level = 3
lto = true


